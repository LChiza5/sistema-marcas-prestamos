<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Marcas y Préstamo de Equipos</title>
    <script>
      // Aplica el tema guardado antes de pintar la página, para evitar
      // un parpadeo del tema equivocado al cargar.
      (function () {
        var guardado = localStorage.getItem('mp-tema');
        var oscuro = guardado
          ? guardado === 'oscuro'
          : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-bs-theme', oscuro ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
